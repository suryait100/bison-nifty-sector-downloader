[project]
name = "bison-nifty-sector-downloader"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "urllib3>=2.0",
    "loguru>=0.7",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
